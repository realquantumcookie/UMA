[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "uma"
version = "0.1.0"
description = "UMA: Unified Motion-Action Modeling for Heterogeneous Robot Learning"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">= 3.10"
dependencies = [
    "numpy",
    "torch>=2.5",
    "torchvision",
    "transformers>=5.0.0rc1",
    "hydra-core",
    "diffusers",
    "tensordict",
    "unienv>=1.0.0",
    "xbarray[torch]>=1.0.0",
    "huggingface_hub",
]

[project.optional-dependencies]
# Plotting in examples/forward_pass.py (--plot).
examples = ["matplotlib"]

[tool.setuptools.packages.find]
include = ["uma*"]

[tool.setuptools.package-data]
"uma" = ["configs/*.yaml"]
